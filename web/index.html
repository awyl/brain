<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f5f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Brain</title>
<style>
  :root { --bg:#f6f5f2; --fg:#1d1d1b; --muted:#8a8780; --me:#dfe8f5; --bot:#fff; --line:#e3e1dc; color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#171716; --fg:#ecebe8; --muted:#8a8780; --me:#26364d; --bot:#232321; --line:#33322f; color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  body { margin:0; height:100dvh; display:flex; flex-direction:column; background:var(--bg); color:var(--fg);
         font:16px/1.45 -apple-system, system-ui, sans-serif; }
  #log { flex:1; overflow-y:auto; padding:calc(env(safe-area-inset-top) + 12px) 16px 12px; }
  .msg { max-width:85%; margin:6px 0; padding:8px 12px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .me { margin-left:auto; background:var(--me); }
  .bot { background:var(--bot); border:1px solid var(--line); }
  .hint { color:var(--muted); font-size:13px; text-align:center; margin:8px 0 16px; }
  form { display:flex; gap:8px; padding:8px 16px calc(env(safe-area-inset-bottom) + 8px); border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; font:inherit; padding:8px 12px; border-radius:12px; border:1px solid var(--line);
             background:var(--bot); color:var(--fg); max-height:40vh; }
  button { font:inherit; padding:0 16px; border:0; border-radius:12px; background:var(--fg); color:var(--bg); }
  button:disabled { opacity:.4; }
</style>
</head>
<body>
<div id="log"><p class="hint">Ask or tell anything. Start with <b>+</b> to dump straight to the inbox.</p></div>
<form id="f">
  <textarea id="t" rows="1" placeholder="Message" autofocus></textarea>
  <button id="b">Send</button>
</form>
<script>
const log = document.getElementById('log'), t = document.getElementById('t'), b = document.getElementById('b');
// Token: from ?token= once (then hidden from the URL), remembered on this device.
const store = { get: () => { try { return localStorage.getItem('token') || ''; } catch { return ''; } },
                set: v => { try { localStorage.setItem('token', v); } catch {} } };
const urlToken = new URLSearchParams(location.search).get('token');
if (urlToken) { store.set(urlToken); history.replaceState(null, '', location.pathname); }
async function send(message) {
  const post = () => fetch('api/chat', { method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + store.get() },
    body:JSON.stringify({message}) });
  let r = await post();
  if (r.status === 401) {
    const tok = prompt('Access token (printed by brain serve):');
    if (!tok) return r;
    store.set(tok.trim()); r = await post();
  }
  return r;
}
function add(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const message = t.value.trim();
  if (!message) return;
  add(message, 'me'); t.value = ''; b.disabled = true;
  const pending = add('…', 'bot');
  try {
    const r = await send(message);
    pending.textContent = r.ok ? (await r.json()).reply : r.status === 401 ? 'Unauthorized: wrong or missing token.' : `Error ${r.status}`;
  } catch (err) {
    pending.textContent = 'Network error: ' + err.message;
  }
  b.disabled = false; log.scrollTop = log.scrollHeight;
});
// Enter sends on desktop; Shift+Enter for newline.
t.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); b.click(); }
});
</script>
</body>
</html>
