<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f5f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Brain</title>
<style>
  :root { --bg:#f6f5f2; --fg:#1d1d1b; --muted:#8a8780; --me:#dfe8f5; --bot:#fff; --line:#e3e1dc; color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#171716; --fg:#ecebe8; --muted:#8a8780; --me:#26364d; --bot:#232321; --line:#33322f; color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  body { margin:0; height:100dvh; display:flex; flex-direction:column; background:var(--bg); color:var(--fg);
         font:16px/1.45 -apple-system, system-ui, sans-serif; }
  #log { flex:1; overflow-y:auto; padding:calc(env(safe-area-inset-top) + 12px) 16px 12px; }
  .msg { max-width:85%; margin:6px 0; padding:8px 12px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .me { margin-left:auto; background:var(--me); }
  .bot { background:var(--bot); border:1px solid var(--line); }
  .steps { color:var(--muted); font-size:13px; }
  .steps:empty { display:none; }
  .live { color:var(--muted); }
  .hint { color:var(--muted); font-size:13px; text-align:center; margin:8px 0 16px; }
  form { display:flex; gap:8px; padding:8px 16px calc(env(safe-area-inset-bottom) + 8px); border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; font:inherit; padding:8px 12px; border-radius:12px; border:1px solid var(--line);
             background:var(--bot); color:var(--fg); max-height:40vh; }
  button { font:inherit; padding:0 16px; border:0; border-radius:12px; background:var(--fg); color:var(--bg); }
  button:disabled { opacity:.4; }
  button.secondary { padding:0 12px; background:transparent; color:var(--muted); border:1px solid var(--line); }
  button.q { display:block; width:100%; margin-top:6px; padding:6px 10px; text-align:left; color:var(--fg); }
</style>
</head>
<body>
<div id="log"><p class="hint">Ask or tell anything. Start with <b>+</b> to dump straight to the inbox.</p></div>
<form id="f">
  <button type="button" id="n" class="secondary" title="Start a new chat (clears context)">New</button>
  <button type="button" id="q" class="secondary" title="Open questions about you">Q</button>
  <textarea id="t" rows="1" placeholder="Message" autofocus></textarea>
  <button id="b">Send</button>
</form>
<script>
const log = document.getElementById('log'), t = document.getElementById('t'), b = document.getElementById('b');
// Token: from ?token= once (then hidden from the URL), remembered on this device.
// Kept in memory too, so it still works when storage is blocked (private tab, in-app browser).
let memToken = '';
const store = { get: () => { try { return localStorage.getItem('token') || memToken; } catch { return memToken; } },
                set: v => { memToken = v; try { localStorage.setItem('token', v); } catch {} } };
const urlToken = new URLSearchParams(location.search).get('token');
if (urlToken) { store.set(urlToken); history.replaceState(null, '', location.pathname); }
// Chat log, kept on this device across reloads. The last 6 non-capture turns go with each message as context.
let chat = [];
try { chat = JSON.parse(localStorage.getItem('chat') || '[]'); } catch {}
const save = () => { try { localStorage.setItem('chat', JSON.stringify(chat.slice(-100))); } catch {} };
const turns = () => chat.filter(m => !m.capture).slice(-6).map(({ role, text }) => ({ role, text }));
for (const m of chat) add(m.text, m.role === 'user' ? 'me' : 'bot');
document.getElementById('n').addEventListener('click', () => {
  chat = []; save();
  log.querySelectorAll('.msg').forEach(m => m.remove());
  t.focus();
});
// fetch with the token; on 401 asks for it once and retries.
async function api(path, opts = {}) {
  const go = () => fetch(path, { ...opts, headers:{ ...opts.headers, 'Authorization':'Bearer ' + store.get() } });
  let r = await go();
  if (r.status === 401) {
    const tok = prompt('Access token (printed by brain serve):');
    if (!tok) return r;
    store.set(tok.trim()); r = await go();
  }
  return r;
}
const send = message => api('api/chat', { method:'POST', headers:{ 'Content-Type':'application/json' },
  body:JSON.stringify({ message, history: turns() }) });
const failed = r => new Error(r.status === 401 ? 'Unauthorized: wrong or missing token.' : `Error ${r.status}`);
// Open questions from the profile: tap one to start an answer. Not kept in the chat log.
document.getElementById('q').addEventListener('click', async () => {
  const d = add('…', 'bot');
  try {
    const r = await api('api/questions');
    if (!r.ok) throw failed(r);
    const { questions } = await r.json();
    d.textContent = questions.length ? 'Open questions, tap one to answer:' : 'No open questions.';
    for (const q of questions) {
      const btn = d.appendChild(document.createElement('button'));
      btn.type = 'button'; btn.className = 'secondary q'; btn.textContent = q;
      btn.onclick = () => { t.value = `Q: ${q} A: `; t.focus(); };
    }
  } catch (err) { d.textContent = err.message; }
  log.scrollTop = log.scrollHeight;
});
function add(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const message = t.value.trim();
  if (!message) return;
  add(message, 'me'); t.value = ''; b.disabled = true;
  const pending = add('', 'bot');
  const steps = pending.appendChild(document.createElement('div')); steps.className = 'steps';
  const text = pending.appendChild(document.createElement('div')); text.className = 'live'; text.textContent = '…';
  try {
    const r = await send(message);
    if (!r.ok) throw failed(r);
    // Server-sent events: delta (live text), status (tool step), done (final reply).
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '', live = '', reply = null;
    while (reply === null) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith('data: ')) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === 'delta') { live += ev.text; text.textContent = live; }
        else if (ev.type === 'status') { steps.textContent += (steps.textContent ? '\n' : '') + '› ' + ev.text; }
        else if (ev.type === 'done') reply = ev.reply;
      }
      log.scrollTop = log.scrollHeight;
    }
    if (reply === null) throw new Error('Connection closed before the reply finished.');
    text.className = ''; text.textContent = reply;
    const capture = message.startsWith('+');
    chat.push({ role:'user', text:message, capture }, { role:'assistant', text:reply, capture }); save();
  } catch (err) {
    text.className = ''; text.textContent = err.message;
  }
  b.disabled = false; log.scrollTop = log.scrollHeight;
});
// Enter sends on desktop; Shift+Enter for newline.
t.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); b.click(); }
});
</script>
</body>
</html>
