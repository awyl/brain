[package]
name = "brain"
version = "0.1.0"
edition = "2024"

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
libc = "0.2.190"
serde_json = "1.0.151"
tiny_http = "0.12.0"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
ureq = "3.4"
